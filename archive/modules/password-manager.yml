services:
  password-manager:
    build: ./services/password-manager
    container_name: deepkit-password-manager
    labels:
      - "com.docker.compose.project=deepkit"
      - "com.docker.compose.service=password-manager"
      - "deepkit.service.name=password-manager"
      - "deepkit.service.port=7716"
      - "deepkit.health.path=/health"
      - "deepkit.service.type=http"
      - "deepkit.service.zone=THE VAULT"
      - "deepkit.service.description=Password Manager"
      # Traefik routing
      - "traefik.enable=true"
      - "traefik.http.routers.password-manager.rule=PathPrefix(`/passwords`)"
      - "traefik.http.routers.password-manager.entrypoints=web"
      - "traefik.http.routers.password-manager.middlewares=deepkit-auth"
      - "traefik.http.services.password-manager.loadbalancer.server.port=7716"
    restart: unless-stopped
    ports:
      - "7716:7716"
    environment:
      - PORT=7716
      - SERVICE_NAME=password-manager
      - NODE_ENV=${NODE_ENV:-production}
      - POSTGRES_HOST=deepkit-store
      - POSTGRES_PORT=5432
      - POSTGRES_DB=passwords
      - POSTGRES_USER=${POSTGRES_USER:-deepkit}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - REDIS_HOST=deepkit-cache
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DEEPKIT_INTERNAL_TOKEN=${DEEPKIT_INTERNAL_TOKEN:-}
    volumes:
      - ./backend/lib/deepkit-fabric/bundle:/app/node_modules/deepkit-fabric:ro
    depends_on:
      deepkit-store:
        condition: service_healthy
      deepkit-cache:
        condition: service_started
    networks:
      - deepkit-network

networks:
  deepkit-network:
    external: true
    name: deepkit-network
