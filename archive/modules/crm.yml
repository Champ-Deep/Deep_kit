# =============================================================================
# MODULE: DEEPKIT_SALES (EspoCRM)
# =============================================================================
# "I want to track contacts, deals, and customers"
#
# Services: DEEPKIT_SALES, MariaDB (internal)
# Ports: 3004, 3306
# Dependencies: Core
# Note: DEEPKIT_SALES requires MariaDB, included in this module
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MariaDB - DEEPKIT_SALES Database (port 3306)
  # ---------------------------------------------------------------------------
  deepkit-mariadb:
    image: mariadb:10.11
    container_name: deepkit-mariadb
    labels:
      - "com.docker.compose.project=deepkit"
      - "com.docker.compose.service=crm"
      - "deepkit.service.name=crm"
      - "deepkit.service.port=3004"
      - "deepkit.health.path=/health"
      - "deepkit.service.type=http"
      - "deepkit.service.zone=THE FACE"
      - "deepkit.service.description=Customer Relationship Management"
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: espocrm
      MARIADB_USER: espocrm
      MARIADB_PASSWORD: ${ESPOCRM_DB_PASSWORD:?ESPOCRM_DB_PASSWORD is required}
    volumes:
      - sales_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deepkit-network

  # ---------------------------------------------------------------------------
  # DEEPKIT_SALES - Customer Relationship Management (port 3004)
  # ---------------------------------------------------------------------------
  deepkit-sales:
    image: espocrm/espocrm:latest
    container_name: deepkit-sales
    restart: unless-stopped
        ports:
          - "7704:80"
        environment:
          - ESPOCRM_DATABASE_HOST=deepkit-mariadb
          - ESPOCRM_DATABASE_USER=espocrm
          - ESPOCRM_DATABASE_PASSWORD=${ESPOCRM_DB_PASSWORD}
          - ESPOCRM_DATABASE_NAME=espocrm
          - ESPOCRM_SITE_URL=${ESPOCRM_SITE_URL}
          - ESPOCRM_ADMIN_USERNAME=${ESPOCRM_ADMIN_USERNAME}
          - ESPOCRM_ADMIN_PASSWORD=${ESPOCRM_ADMIN_PASSWORD}
        networks:
          - deepkit-network
volumes:
  sales_mariadb_data:
    name: deepkit-sales-mariadb-data
  sales_data:
    name: deepkit-sales-data
