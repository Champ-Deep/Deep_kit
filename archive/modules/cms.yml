# =============================================================================
# MODULE: DEEPKIT_CONTENT (Strapi CMS)
# =============================================================================
# "I want to manage blog posts, pages, and content"
#
# Services: DEEPKIT_CONTENT
# Ports: 3003
# Dependencies: Core (DEEPKIT_STORE)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # DEEPKIT_CONTENT - Headless CMS (port 3003)
  # ---------------------------------------------------------------------------
  deepkit-content:
    image: strapi:latest
    container_name: deepkit-content
    restart: unless-stopped
    ports:
      - "7703:1337"
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: deepkit-store
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: ${POSTGRES_USER:-deepkit}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      APP_KEYS: ${STRAPI_APP_KEYS}
    networks:
      - deepkit-network

volumes:
  content_data:
    name: deepkit-content-data

networks:
  deepkit-network:
    external: true
    name: deepkit-network
