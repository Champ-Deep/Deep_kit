services:
  time-tracker:
    build: ./services/time-tracker
    container_name: deepkit-time-tracker
    labels:
      - "com.docker.compose.project=deepkit"
      - "com.docker.compose.service=time-tracker"
      - "deepkit.service.name=time-tracker"
      - "deepkit.service.port=7719"
      - "deepkit.health.path=/health"
      - "deepkit.service.type=http"
      - "deepkit.service.zone=THE FACE"
      - "deepkit.service.description=Time Tracking"
      # Traefik routing
      - "traefik.enable=true"
      - "traefik.http.routers.time-tracker.rule=PathPrefix(`/time-tracker`)"
      - "traefik.http.routers.time-tracker.entrypoints=web"
      - "traefik.http.routers.time-tracker.middlewares=deepkit-auth"
      - "traefik.http.services.time-tracker.loadbalancer.server.port=7719"
    restart: unless-stopped
    ports:
      - "7719:7719"
    environment:
      - PORT=7719
      - SERVICE_NAME=time-tracker
      - NODE_ENV=${NODE_ENV:-production}
      - POSTGRES_HOST=deepkit-store
      - POSTGRES_PORT=5432
      - POSTGRES_DB=timetracker
      - POSTGRES_USER=${POSTGRES_USER:-deepkit}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=deepkit-cache
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DEEPKIT_INTERNAL_TOKEN=${DEEPKIT_INTERNAL_TOKEN:-}
    volumes:
      - ./backend/lib/deepkit-fabric/bundle:/app/node_modules/deepkit-fabric:ro
    depends_on:
      deepkit-store:
        condition: service_healthy
      deepkit-cache:
        condition: service_started
    networks:
      - deepkit-network

networks:
  deepkit-network:
    external: true
    name: deepkit-network
