# =============================================================================
# MODULE: DEEPKIT_DATA (Adminer)
# =============================================================================
# "I want a visual interface to manage databases"
#
# Services: DEEPKIT_DATA
# Ports: 9003
# Dependencies: Core (DEEPKIT_STORE)
# Note: DEEPKIT_DATA supports PostgreSQL, MySQL, MariaDB, SQLite - one tool for all
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # DEEPKIT_DATA - Universal Database UI (port 9003)
  # ---------------------------------------------------------------------------
  deepkit-data:
    image: adminer:latest
    container_name: deepkit-data
    restart: unless-stopped
    ports:
      - "9003:8080"
    labels:
      - "com.docker.compose.project=deepkit"
      - "com.docker.compose.service=admin-db"
      - "deepkit.service.name=Adminer"
      - "deepkit.service.port=9003"
      - "deepkit.health.path=/"
      - "deepkit.service.type=http"
      - "deepkit.service.zone=MONITORING"
      - "deepkit.service.description=Database Dashboard"
      # Traefik routing (REQUIRES auth - direct DB access)
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=PathPrefix(`/adminer`)"
      - "traefik.http.routers.adminer.entrypoints=web"
      - "traefik.http.routers.adminer.middlewares=deepkit-auth"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"
    environment:
      ADMINER_DEFAULT_SERVER: deepkit-store
      ADMINER_DESIGN: nette
      ADMINER_PLUGINS: tables-filter tinymce
    volumes:
      - ./branding/css/deepkit-data.css:/var/www/html/adminer.css:ro
    networks:
      - deepkit-network
