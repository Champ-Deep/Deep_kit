services:
  file-manager:
    build: ./services/file-manager
    container_name: deepkit-file-manager
    labels:
      - "com.docker.compose.project=deepkit"
      - "com.docker.compose.service=file-manager"
      - "deepkit.service.name=file-manager"
      - "deepkit.service.port=7720"
      - "deepkit.health.path=/health"
      - "deepkit.service.type=http"
      - "deepkit.service.zone=THE FACE"
      - "deepkit.service.description=File Manager"
      # Traefik routing
      - "traefik.enable=true"
      - "traefik.http.routers.file-manager.rule=PathPrefix(`/files`)"
      - "traefik.http.routers.file-manager.entrypoints=web"
      - "traefik.http.routers.file-manager.middlewares=deepkit-auth"
      - "traefik.http.services.file-manager.loadbalancer.server.port=7720"
    restart: unless-stopped
    ports:
      - "7720:7720"
    environment:
      - PORT=7720
      - SERVICE_NAME=file-manager
      - NODE_ENV=${NODE_ENV:-production}
      - POSTGRES_HOST=deepkit-store
      - POSTGRES_PORT=5432
      - POSTGRES_DB=filemanager
      - POSTGRES_USER=${POSTGRES_USER:-deepkit}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=deepkit-cache
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DEEPKIT_INTERNAL_TOKEN=${DEEPKIT_INTERNAL_TOKEN:-}
    volumes:
      - ./backend/lib/deepkit-fabric/bundle:/app/node_modules/deepkit-fabric:ro
    depends_on:
      deepkit-store:
        condition: service_healthy
      deepkit-cache:
        condition: service_started
    networks:
      - deepkit-network

networks:
  deepkit-network:
    external: true
    name: deepkit-network
