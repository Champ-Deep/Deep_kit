# =============================================================================
# MODULE: DEEPKIT_VECTOR (Qdrant)
# =============================================================================
# "I want semantic search and RAG capabilities"
#
# Services: DEEPKIT_VECTOR
# Ports: 6333
# Dependencies: Core (DEEPKIT_ENGINE for embeddings)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # DEEPKIT_VECTOR - Vector Database (port 6333)
  # ---------------------------------------------------------------------------
  deepkit-vector:
    image: qdrant/qdrant:latest
    container_name: deepkit-vector
    labels:
      - "com.docker.compose.project=deepkit"
      - "com.docker.compose.service=vector"
      - "deepkit.service.name=vector"
      - "deepkit.service.port=6333"
      - "deepkit.health.path=/readyz"
      - "deepkit.service.type=http"
      - "deepkit.service.zone=THE VAULT"
      - "deepkit.service.description=Vector Database"
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - vector_data:/qdrant/storage
    networks:
      - deepkit-network

volumes:
  vector_data:
    name: deepkit-vector-data
