services:
  invoicing:
    build: ./services/invoicing
    container_name: deepkit-invoicing
    labels:
      - "com.docker.compose.project=deepkit"
      - "com.docker.compose.service=invoicing"
      - "deepkit.service.name=invoicing"
      - "deepkit.service.port=7715"
      - "deepkit.health.path=/health"
      - "deepkit.service.type=http"
      - "deepkit.service.zone=THE FACE"
      - "deepkit.service.description=Invoice & Billing"
      # Traefik routing
      - "traefik.enable=true"
      - "traefik.http.routers.invoicing.rule=PathPrefix(`/invoicing`)"
      - "traefik.http.routers.invoicing.entrypoints=web"
      - "traefik.http.routers.invoicing.middlewares=deepkit-auth"
      - "traefik.http.services.invoicing.loadbalancer.server.port=7715"
    restart: unless-stopped
    ports:
      - "7715:7715"
    environment:
      - PORT=7715
      - SERVICE_NAME=invoicing
      - NODE_ENV=${NODE_ENV:-production}
      - POSTGRES_HOST=deepkit-store
      - POSTGRES_PORT=5432
      - POSTGRES_DB=invoicing
      - POSTGRES_USER=${POSTGRES_USER:-deepkit}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=deepkit-cache
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DEEPKIT_INTERNAL_TOKEN=${DEEPKIT_INTERNAL_TOKEN:-}
    volumes:
      - ./backend/lib/deepkit-fabric/bundle:/app/node_modules/deepkit-fabric:ro
    depends_on:
      deepkit-store:
        condition: service_healthy
      deepkit-cache:
        condition: service_started
    networks:
      - deepkit-network

networks:
  deepkit-network:
    external: true
    name: deepkit-network
