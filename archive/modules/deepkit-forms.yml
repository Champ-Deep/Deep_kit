services:
  deepkit-forms:
    build: ./services/deepkit-forms
    container_name: deepkit-forms
    labels:
      - "com.docker.compose.project=deepkit"
      - "com.docker.compose.service=deepkit-forms"
      - "deepkit.service.name=deepkit-forms"
      - "deepkit.service.port=3009"
      - "deepkit.health.path=/health"
      - "deepkit.service.type=http"
      - "deepkit.service.zone=THE FACE"
      - "deepkit.service.description=Form Builder"
      # Traefik routing
      - "traefik.enable=true"
      - "traefik.http.routers.deepkit-forms.rule=PathPrefix(`/forms`)"
      - "traefik.http.routers.deepkit-forms.entrypoints=web"
      - "traefik.http.routers.deepkit-forms.middlewares=deepkit-auth"
      - "traefik.http.services.deepkit-forms.loadbalancer.server.port=3009"
    restart: unless-stopped
    ports:
      - "3009:3009"
    environment:
      - PORT=3009
      - SERVICE_NAME=deepkit-forms
      - NODE_ENV=${NODE_ENV:-production}
      - POSTGRES_HOST=${POSTGRES_HOST:-deepkit-store}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-deepkit}
      - POSTGRES_USER=${POSTGRES_USER:-deepkit}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=deepkit-cache
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DEEPKIT_INTERNAL_TOKEN=${DEEPKIT_INTERNAL_TOKEN:-}
    volumes:
      - ./backend/lib/deepkit-fabric/bundle:/app/node_modules/deepkit-fabric:ro
    networks:
      - deepkit-network
    depends_on:
      deepkit-store:
        condition: service_healthy
      deepkit-cache:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3009/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  deepkit-network:
    external: true
    name: deepkit-network
