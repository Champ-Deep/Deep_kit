<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEEPKIT_RECORDER</title>

  <!-- React & ReactDOM from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* =================================================================== */
    /* DEEPKIT CRT AESTHETIC - Base Styles */
    /* =================================================================== */

    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

    :root {
      --deep-core: #0A0B10;
      --port-active: #7000FF;
      --data-flow: #00F2FF;
      --success: #39FF14;
      --warning: #FF3B3B;
      --text: #FFFFFF;
      --text-dim: #A0A0A0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--deep-core);
      color: var(--text);
      overflow-x: hidden;
      position: relative;
    }

    /* CRT Scanline effect */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        transparent 50%,
        rgba(0, 242, 255, 0.03) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 9999;
      animation: scan 8s linear infinite;
    }

    @keyframes scan {
      0% { transform: translateY(0); }
      100% { transform: translateY(4px); }
    }

    /* CRT flicker */
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.97; }
    }

    body {
      animation: flicker 0.15s infinite;
    }

    /* =================================================================== */
    /* Layout */
    /* =================================================================== */

    .container {
      min-height: 100vh;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* =================================================================== */
    /* Header */
    /* =================================================================== */

    .header {
      border: 2px solid var(--data-flow);
      padding: 1.5rem;
      margin-bottom: 2rem;
      background: rgba(0, 242, 255, 0.05);
      position: relative;
    }

    .header::before {
      content: '[ SYSTEM_ONLINE ]';
      position: absolute;
      top: -12px;
      left: 20px;
      background: var(--deep-core);
      padding: 0 10px;
      font-size: 10px;
      color: var(--success);
      letter-spacing: 2px;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -2px;
      color: var(--data-flow);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 0.75rem;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    /* =================================================================== */
    /* Recording Area */
    /* =================================================================== */

    .recording-area {
      border: 2px solid var(--port-active);
      padding: 2rem;
      margin-bottom: 2rem;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: rgba(112, 0, 255, 0.05);
    }

    .recording-area.active {
      border-color: var(--warning);
      background: rgba(255, 59, 59, 0.05);
    }

    .recording-indicator {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .rec-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--warning);
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .timer {
      font-size: 2rem;
      font-weight: 700;
      color: var(--warning);
      font-variant-numeric: tabular-nums;
    }

    .preview-message {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.875rem;
    }

    .preview-video {
      max-width: 100%;
      border: 1px solid var(--data-flow);
      margin-top: 1rem;
    }

    /* =================================================================== */
    /* Controls */
    /* =================================================================== */

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .control-group {
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1rem;
    }

    .control-label {
      font-size: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
      display: block;
    }

    .btn {
      font-family: 'JetBrains Mono', monospace;
      padding: 0.75rem 1.5rem;
      border: 2px solid;
      background: transparent;
      color: var(--text);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }

    .btn-primary {
      border-color: var(--port-active);
      color: var(--port-active);
    }

    .btn-primary:hover {
      background: var(--port-active);
      color: var(--deep-core);
    }

    .btn-danger {
      border-color: var(--warning);
      color: var(--warning);
    }

    .btn-danger:hover {
      background: var(--warning);
      color: var(--deep-core);
    }

    .btn-success {
      border-color: var(--success);
      color: var(--success);
    }

    .btn-success:hover {
      background: var(--success);
      color: var(--deep-core);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .radio-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .radio-option {
      flex: 1;
      min-width: 80px;
    }

    .radio-option input {
      display: none;
    }

    .radio-option label {
      display: block;
      padding: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      font-size: 0.625rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .radio-option input:checked + label {
      border-color: var(--data-flow);
      background: rgba(0, 242, 255, 0.1);
      color: var(--data-flow);
    }

    .checkbox-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      margin-bottom: 0.5rem;
      transition: all 0.2s;
    }

    .checkbox-option:hover {
      border-color: var(--data-flow);
      background: rgba(0, 242, 255, 0.05);
    }

    .checkbox-option input {
      width: 16px;
      height: 16px;
      accent-color: var(--data-flow);
    }

    .checkbox-option label {
      font-size: 0.75rem;
      cursor: pointer;
      flex: 1;
    }

    /* =================================================================== */
    /* Modal */
    /* =================================================================== */

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }

    .modal {
      background: var(--deep-core);
      border: 2px solid var(--data-flow);
      padding: 2rem;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 1.5rem;
      color: var(--data-flow);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: -1px;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-size: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }

    .form-input,
    .form-textarea {
      width: 100%;
      padding: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
    }

    .form-input:focus,
    .form-textarea:focus {
      outline: none;
      border-color: var(--data-flow);
      background: rgba(0, 242, 255, 0.05);
    }

    .form-textarea {
      resize: vertical;
      min-height: 100px;
    }

    .modal-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .modal-actions .btn {
      flex: 1;
    }

    /* =================================================================== */
    /* Status Messages */
    /* =================================================================== */

    .status-message {
      padding: 1rem;
      border: 1px solid;
      margin-bottom: 1rem;
      font-size: 0.875rem;
    }

    .status-message.success {
      border-color: var(--success);
      background: rgba(57, 255, 20, 0.1);
      color: var(--success);
    }

    .status-message.error {
      border-color: var(--warning);
      background: rgba(255, 59, 59, 0.1);
      color: var(--warning);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function DeepKitRecorder() {
      // State
      const [mode, setMode] = useState('screen'); // screen, window, tab
      const [audioMic, setAudioMic] = useState(false);
      const [audioSystem, setAudioSystem] = useState(false);
      const [isRecording, setIsRecording] = useState(false);
      const [isPaused, setIsPaused] = useState(false);
      const [duration, setDuration] = useState(0);
      const [videoBlob, setVideoBlob] = useState(null);
      const [showSaveModal, setShowSaveModal] = useState(false);
      const [statusMessage, setStatusMessage] = useState(null);

      // Form state
      const [project, setProject] = useState('default');
      const [notes, setNotes] = useState('');
      const [tags, setTags] = useState('');

      // Refs
      const mediaRecorderRef = useRef(null);
      const displayStreamRef = useRef(null);
      const audioStreamRef = useRef(null);
      const chunksRef = useRef([]);
      const timerRef = useRef(null);
      const previewRef = useRef(null);

      // Format time as MM:SS
      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      // Start recording
      const startRecording = async () => {
        try {
          // Request display media
          const displayStream = await navigator.mediaDevices.getDisplayMedia({
            video: {
              cursor: 'always',
              displaySurface: mode
            },
            audio: audioSystem
          });

          displayStreamRef.current = displayStream;

          // Request audio if mic is enabled
          let audioStream = null;
          if (audioMic) {
            audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioStreamRef.current = audioStream;
          }

          // Combine streams
          let tracks = [...displayStream.getVideoTracks()];
          if (audioSystem && displayStream.getAudioTracks().length > 0) {
            tracks.push(...displayStream.getAudioTracks());
          }
          if (audioMic && audioStream) {
            tracks.push(...audioStream.getAudioTracks());
          }

          const combinedStream = new MediaStream(tracks);

          // Create MediaRecorder
          const recorder = new MediaRecorder(combinedStream, {
            mimeType: 'video/webm;codecs=vp9',
            videoBitsPerSecond: 2500000
          });

          recorder.ondataavailable = (e) => {
            if (e.data.size > 0) {
              chunksRef.current.push(e.data);
            }
          };

          recorder.onstop = () => {
            const blob = new Blob(chunksRef.current, { type: 'video/webm' });
            setVideoBlob(blob);
            setShowSaveModal(true);
            cleanup();
          };

          recorder.start(1000); // Capture in 1s chunks
          mediaRecorderRef.current = recorder;
          setIsRecording(true);

          // Start timer
          timerRef.current = setInterval(() => {
            setDuration(d => d + 1);
          }, 1000);

        } catch (error) {
          console.error('Recording error:', error);
          setStatusMessage({ type: 'error', text: `Failed to start recording: ${error.message}` });
        }
      };

      // Stop recording
      const stopRecording = () => {
        if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
          mediaRecorderRef.current.stop();
          setIsRecording(false);
          clearInterval(timerRef.current);
        }
      };

      // Pause recording
      const pauseRecording = () => {
        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
          mediaRecorderRef.current.pause();
          setIsPaused(true);
          clearInterval(timerRef.current);
        }
      };

      // Resume recording
      const resumeRecording = () => {
        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'paused') {
          mediaRecorderRef.current.resume();
          setIsPaused(false);
          timerRef.current = setInterval(() => {
            setDuration(d => d + 1);
          }, 1000);
        }
      };

      // Cleanup streams
      const cleanup = () => {
        if (displayStreamRef.current) {
          displayStreamRef.current.getTracks().forEach(track => track.stop());
          displayStreamRef.current = null;
        }
        if (audioStreamRef.current) {
          audioStreamRef.current.getTracks().forEach(track => track.stop());
          audioStreamRef.current = null;
        }
      };

      // Save recording
      const saveRecording = async () => {
        if (!videoBlob) return;

        try {
          const formData = new FormData();
          formData.append('recording', videoBlob, 'recording.webm');
          formData.append('project', project);
          formData.append('notes', notes);
          formData.append('tags', JSON.stringify(tags.split(',').map(t => t.trim()).filter(Boolean)));
          formData.append('duration', duration.toString());
          formData.append('annotations', JSON.stringify([])); // TODO: Add annotation support

          const response = await fetch('/api/recordings/upload', {
            method: 'POST',
            body: formData
          });

          if (response.ok) {
            const result = await response.json();
            setStatusMessage({
              type: 'success',
              text: `Recording saved! ${result.filename} (${(result.size / 1024 / 1024).toFixed(2)} MB)`
            });
            reset();
          } else {
            throw new Error('Upload failed');
          }

        } catch (error) {
          console.error('Save error:', error);
          setStatusMessage({ type: 'error', text: `Failed to save recording: ${error.message}` });
        }
      };

      // Download recording
      const downloadRecording = () => {
        if (!videoBlob) return;

        const url = URL.createObjectURL(videoBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `recording-${new Date().toISOString().replace(/[:.]/g, '-')}.webm`;
        a.click();
        URL.revokeObjectURL(url);

        setStatusMessage({ type: 'success', text: 'Recording downloaded!' });
        reset();
      };

      // Reset state
      const reset = () => {
        setShowSaveModal(false);
        setVideoBlob(null);
        setDuration(0);
        chunksRef.current = [];
        setProject('default');
        setNotes('');
        setTags('');
      };

      // Preview video when available
      useEffect(() => {
        if (videoBlob && previewRef.current) {
          const url = URL.createObjectURL(videoBlob);
          previewRef.current.src = url;
          return () => URL.revokeObjectURL(url);
        }
      }, [videoBlob]);

      return (
        <div className="container">
          {/* Header */}
          <div className="header">
            <h1>🎥 DEEPKIT_RECORDER</h1>
            <p>Screen Recording with Annotations • Port 3006</p>
          </div>

          {/* Status Messages */}
          {statusMessage && (
            <div className={`status-message ${statusMessage.type}`}>
              {statusMessage.text}
              <button
                onClick={() => setStatusMessage(null)}
                style={{ float: 'right', background: 'none', border: 'none', color: 'inherit', cursor: 'pointer' }}
              >
                ✕
              </button>
            </div>
          )}

          {/* Recording Area */}
          <div className={`recording-area ${isRecording ? 'active' : ''}`}>
            {!isRecording && !videoBlob && (
              <div className="preview-message">
                <p style={{ fontSize: '3rem', marginBottom: '1rem' }}>⏺</p>
                <p>Click "Start Recording" to begin</p>
                <p style={{ marginTop: '0.5rem', fontSize: '0.75rem' }}>
                  Configure capture mode and audio settings below
                </p>
              </div>
            )}

            {isRecording && (
              <div className="recording-indicator">
                <div className="rec-dot"></div>
                <div className="timer">{formatTime(duration)}</div>
                <div style={{ fontSize: '0.875rem', color: 'var(--text-dim)' }}>
                  {isPaused ? 'PAUSED' : 'RECORDING'}
                </div>
              </div>
            )}

            {videoBlob && (
              <div>
                <p style={{ marginBottom: '1rem', color: 'var(--data-flow)' }}>
                  ✓ Recording Complete ({formatTime(duration)})
                </p>
                <video ref={previewRef} controls className="preview-video" />
              </div>
            )}
          </div>

          {/* Controls */}
          <div className="controls">
            {/* Capture Mode */}
            <div className="control-group">
              <label className="control-label">Capture Mode</label>
              <div className="radio-group">
                <div className="radio-option">
                  <input
                    type="radio"
                    id="mode-screen"
                    name="mode"
                    value="screen"
                    checked={mode === 'screen'}
                    onChange={(e) => setMode(e.target.value)}
                    disabled={isRecording}
                  />
                  <label htmlFor="mode-screen">Screen</label>
                </div>
                <div className="radio-option">
                  <input
                    type="radio"
                    id="mode-window"
                    name="mode"
                    value="window"
                    checked={mode === 'window'}
                    onChange={(e) => setMode(e.target.value)}
                    disabled={isRecording}
                  />
                  <label htmlFor="mode-window">Window</label>
                </div>
                <div className="radio-option">
                  <input
                    type="radio"
                    id="mode-tab"
                    name="mode"
                    value="browser"
                    checked={mode === 'browser'}
                    onChange={(e) => setMode(e.target.value)}
                    disabled={isRecording}
                  />
                  <label htmlFor="mode-tab">Tab</label>
                </div>
              </div>
            </div>

            {/* Audio Settings */}
            <div className="control-group">
              <label className="control-label">Audio Sources</label>
              <div className="checkbox-option">
                <input
                  type="checkbox"
                  id="audio-mic"
                  checked={audioMic}
                  onChange={(e) => setAudioMic(e.target.checked)}
                  disabled={isRecording}
                />
                <label htmlFor="audio-mic">Microphone</label>
              </div>
              <div className="checkbox-option">
                <input
                  type="checkbox"
                  id="audio-system"
                  checked={audioSystem}
                  onChange={(e) => setAudioSystem(e.target.checked)}
                  disabled={isRecording}
                />
                <label htmlFor="audio-system">System Audio</label>
              </div>
            </div>

            {/* Recording Controls */}
            <div className="control-group">
              <label className="control-label">Recording Controls</label>
              {!isRecording && !videoBlob && (
                <button className="btn btn-primary" onClick={startRecording}>
                  ⏺ Start Recording
                </button>
              )}

              {isRecording && !isPaused && (
                <>
                  <button className="btn btn-primary" onClick={pauseRecording} style={{ marginBottom: '0.5rem' }}>
                    ⏸ Pause
                  </button>
                  <button className="btn btn-danger" onClick={stopRecording}>
                    ⏹ Stop
                  </button>
                </>
              )}

              {isRecording && isPaused && (
                <>
                  <button className="btn btn-success" onClick={resumeRecording} style={{ marginBottom: '0.5rem' }}>
                    ▶ Resume
                  </button>
                  <button className="btn btn-danger" onClick={stopRecording}>
                    ⏹ Stop
                  </button>
                </>
              )}

              {videoBlob && (
                <button className="btn btn-primary" onClick={reset}>
                  🔄 New Recording
                </button>
              )}
            </div>
          </div>

          {/* Save Modal */}
          {showSaveModal && (
            <div className="modal-overlay">
              <div className="modal">
                <h2>💾 Save Recording</h2>

                <div className="form-group">
                  <label className="form-label">Project</label>
                  <input
                    type="text"
                    className="form-input"
                    value={project}
                    onChange={(e) => setProject(e.target.value)}
                    placeholder="default"
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Notes</label>
                  <textarea
                    className="form-textarea"
                    value={notes}
                    onChange={(e) => setNotes(e.target.value)}
                    placeholder="Add any notes about this recording..."
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Tags (comma-separated)</label>
                  <input
                    type="text"
                    className="form-input"
                    value={tags}
                    onChange={(e) => setTags(e.target.value)}
                    placeholder="demo, tutorial, bug"
                  />
                </div>

                <div className="modal-actions">
                  <button className="btn btn-success" onClick={saveRecording}>
                    💾 Save to DeepKit
                  </button>
                  <button className="btn btn-primary" onClick={downloadRecording}>
                    ⬇ Download
                  </button>
                  <button className="btn" onClick={reset} style={{ borderColor: 'var(--text-dim)', color: 'var(--text-dim)' }}>
                    ✕ Cancel
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DeepKitRecorder />);
  </script>
</body>
</html>
