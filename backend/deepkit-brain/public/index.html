<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepKit Brain</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #0A0B10;
      color: #00F2FF;
      height: 100vh;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.03) 50%, transparent 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 9999;
      animation: scanline 8s linear infinite;
    }
    @keyframes scanline { to { transform: translateY(4px); } }
    .container { display: flex; flex-direction: column; height: 100vh; padding: 2rem; }
    .header {
      text-align: center;
      margin-bottom: 2rem;
      padding: 2rem;
      background: rgba(112,0,255,0.1);
      border: 2px solid #7000FF;
      border-radius: 8px;
    }
    h1 { font-size: 2.5rem; color: #7000FF; text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 20px rgba(112,0,255,0.5); }
    .subtitle { color: #00F2FF; font-size: 0.9rem; opacity: 0.8; margin-top: 0.5rem; }
    .chat-container {
      flex: 1;
      background: rgba(0,242,255,0.05);
      border: 2px solid #00F2FF;
      border-radius: 8px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 1.5rem;
      padding-right: 1rem;
    }
    .message {
      background: rgba(112,0,255,0.1);
      border: 1px solid #7000FF;
      padding: 1rem;
      border-radius: 4px;
      margin-bottom: 1rem;
    }
    .message.user {
      background: rgba(0,242,255,0.1);
      border-color: #00F2FF;
      margin-left: 20%;
    }
    .message-role {
      font-weight: bold;
      font-size: 0.8rem;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      color: #7000FF;
    }
    .message.user .message-role { color: #00F2FF; }
    .message-content { color: #fff; line-height: 1.6; }
    .input-area {
      display: flex;
      gap: 1rem;
    }
    input {
      flex: 1;
      background: rgba(0,242,255,0.1);
      border: 1px solid #00F2FF;
      color: #00F2FF;
      padding: 1rem;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
    }
    input:focus { outline: none; border-color: #7000FF; box-shadow: 0 0 10px rgba(112,0,255,0.3); }
    .button {
      background: #7000FF;
      color: #fff;
      border: none;
      padding: 1rem 2rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s;
      white-space: nowrap;
    }
    .button:hover { background: #8F00FF; box-shadow: 0 0 20px rgba(112,0,255,0.5); }
    .button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_BASE = window.location.origin;

    function App() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [conversationId, setConversationId] = useState(null);
      const [loading, setLoading] = useState(false);
      const messagesEndRef = useRef(null);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const sendMessage = async () => {
        if (!input.trim() || loading) return;

        const userMessage = { role: 'user', content: input };
        setMessages(prev => [...prev, userMessage]);
        setInput('');
        setLoading(true);

        try {
          const response = await fetch(`${API_BASE}/api/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: input,
              conversationId
            })
          });

          const data = await response.json();
          
          if (!conversationId) {
            setConversationId(data.conversationId);
          }

          setMessages(prev => [...prev, { role: 'assistant', content: data.response }]);
        } catch (error) {
          setMessages(prev => [...prev, {
            role: 'assistant',
            content: 'Sorry, I encountered an error. Please try again.'
          }]);
        } finally {
          setLoading(false);
        }
      };

      const handleKeyPress = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      };

      return (
        <div className="container">
          <div className="header">
            <h1>🧠 DeepKit Brain</h1>
            <div className="subtitle">AI Orchestrator - Natural Language Tool Access</div>
          </div>

          <div className="chat-container">
            <div className="messages">
              {messages.length === 0 && (
                <div style={{ textAlign: 'center', color: 'rgba(255,255,255,0.5)', padding: '3rem' }}>
                  <div style={{ fontSize: '2rem', marginBottom: '1rem' }}>👋</div>
                  <div>Hi! I'm DeepKit Brain. I can help you use all DeepKit tools.</div>
                  <div style={{ marginTop: '1rem', fontSize: '0.8rem' }}>
                    Try: "Create a QR code for my website" or "Shorten this URL: https://example.com"
                  </div>
                </div>
              )}
              
              {messages.map((msg, idx) => (
                <div key={idx} className={`message ${msg.role}`}>
                  <div className="message-role">{msg.role}</div>
                  <div className="message-content">{msg.content}</div>
                </div>
              ))}
              
              {loading && (
                <div className="message">
                  <div className="message-role">assistant</div>
                  <div className="message-content">Thinking...</div>
                </div>
              )}
              
              <div ref={messagesEndRef} />
            </div>

            <div className="input-area">
              <input
                type="text"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyPress={handleKeyPress}
                placeholder="Ask me to help with any DeepKit tool..."
                disabled={loading}
              />
              <button className="button" onClick={sendMessage} disabled={loading}>
                Send
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
