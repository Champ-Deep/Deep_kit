# Auto-provision data sources for DeepKit Grafana
apiVersion: 1

datasources:
  # Loki - Log aggregation
  - name: Loki
    type: loki
    access: proxy
    url: http://deepkit-loki:3100
    isDefault: true
    editable: true

  # Prometheus - Metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://deepkit-prometheus:9090
    editable: true
