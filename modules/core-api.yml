# =============================================================================
# DEEPKIT CORE API - AI Orchestration Service
# =============================================================================
# Main API for AI processing, tool execution, and conversation management
# Integrates with OpenCode for AI capabilities
#
# Port: 7777
# =============================================================================

services:
  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: deepkit-core-api
    restart: unless-stopped
    ports:
      - "7777:7777"
    environment:
      - PORT=7777
      - NODE_ENV=production
      - REDIS_URL=redis://deepkit-cache:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - TASK_TRACKER_URL=http://task-tracker:7718
      - OPENCODE_URL=http://opencode:4096
      - OPENCODE_USERNAME=opencode
      - OPENCODE_PASSWORD=${DEEPKIT_INTERNAL_TOKEN:-deepkit}
    depends_on:
      - deepkit-cache
      - deepkit-store
      - task-tracker
    networks:
      - deepkit-network
    volumes:
      - ./services/core-api/public:/app/public:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7777/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
