services:
  task-tracker:
    build: ./services/task-tracker
    container_name: deepkit-task-tracker
    labels:
      - "com.docker.compose.project=deepkit"
      - "com.docker.compose.service=task-tracker"
      - "deepkit.service.name=task-tracker"
      - "deepkit.service.port=7718"
      - "deepkit.health.path=/health"
      - "deepkit.service.type=http"
      - "deepkit.service.zone=THE FACE"
      - "deepkit.service.description=Gamified Task Management"
      # Traefik routing
      - "traefik.enable=true"
      - "traefik.http.routers.task-tracker.rule=PathPrefix(`/task-tracker`)"
      - "traefik.http.routers.task-tracker.entrypoints=web"
      - "traefik.http.routers.task-tracker.middlewares=deepkit-auth"
      - "traefik.http.services.task-tracker.loadbalancer.server.port=7718"
    restart: unless-stopped
    ports:
      - "7718:7718"
    environment:
      - PORT=7718
      - SERVICE_NAME=task-tracker
      - NODE_ENV=${NODE_ENV:-production}
      - POSTGRES_HOST=deepkit-store
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tasktracker
      - POSTGRES_USER=${POSTGRES_USER:-deepkit}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=deepkit-cache
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DEEPKIT_INTERNAL_TOKEN=${DEEPKIT_INTERNAL_TOKEN:-}
    volumes:
      - ./backend/lib/deepkit-fabric/bundle:/app/node_modules/deepkit-fabric:ro
    depends_on:
      deepkit-store:
        condition: service_healthy
      deepkit-cache:
        condition: service_started
    networks:
      - deepkit-network

networks:
  deepkit-network:
    external: true
    name: deepkit-network
