# =============================================================================
# MODULE: DEEPKIT_GATEWAY (Traefik Reverse Proxy)
# =============================================================================
# "The front door to the Arsenal. No unauthorized traffic."
#
# Services: DEEPKIT_GATEWAY
# Ports: 80 (HTTP), 443 (HTTPS), 9080 (Dashboard - internal)
# Dependencies: Core (none specifically)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # DEEPKIT_GATEWAY - Traefik Reverse Proxy (ports 80, 443)
  # ---------------------------------------------------------------------------
  # All services route through the gateway. Direct port access is removed.
  # Services are discovered automatically via Docker labels.
  deepkit-gateway:
    image: traefik:v3.0
    container_name: deepkit-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=${TIMEZONE:-UTC}
    command:
      # API & Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=false"
      # Docker provider - auto-discovers services via labels
      - "--providers.docker=true"
      - "--providers.docker.network=deepkit-network"
      - "--providers.docker.exposedbydefault=false"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect HTTP -> HTTPS when certs are available
      # - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      # Logging
      - "--log.level=WARN"
      - "--accesslog=true"
      - "--accesslog.format=json"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - gateway_certs:/letsencrypt
      - ./config/traefik:/etc/traefik:ro
    labels:
      # Gateway dashboard - accessible at /dashboard/ with auth
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=PathPrefix(`/dashboard`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.middlewares=deepkit-auth"
      # Auth middleware - shared across all protected routes
      - "traefik.http.middlewares.deepkit-auth.basicauth.users=${GATEWAY_AUTH_USERS}"
      - "traefik.http.middlewares.deepkit-auth.basicauth.realm=DeepKit Arsenal"
      # Security headers middleware
      - "traefik.http.middlewares.deepkit-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.deepkit-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.deepkit-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.deepkit-headers.headers.customResponseHeaders.X-Powered-By=DeepKit Arsenal"
      # Rate limiting middleware
      - "traefik.http.middlewares.deepkit-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.deepkit-ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.deepkit-ratelimit.ratelimit.period=1m"
    networks:
      - deepkit-network

volumes:
  gateway_certs:
    name: deepkit-gateway-certs
