# =============================================================================
# DEEPKIT GATEWAY - Message Gateway Service
# =============================================================================
# Normalizes messages from Telegram, WhatsApp, Web, and CLI channels
# Routes messages to Core API for processing
#
# Port: 3333 (HTTP API) + 3334 (WebSocket)
# =============================================================================

services:
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: deepkit-gateway
    restart: unless-stopped
    ports:
      - "3333:3333"
      - "3334:3334"  # WebSocket port
    environment:
      - PORT=3333
      - NODE_ENV=production
      - CORE_API_URL=http://core-api:7777
      - REDIS_URL=redis://deepkit-cache:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      - deepkit-cache
      - core-api
    networks:
      - deepkit-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
