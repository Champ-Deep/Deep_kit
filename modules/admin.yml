# =============================================================================
# MODULE J: Database Admin (Adminer)
# =============================================================================
# "I want a visual interface to manage databases"
#
# Services: Adminer
# Ports: 9003
# Dependencies: Core (PostgreSQL)
# Note: Adminer supports PostgreSQL, MySQL, MariaDB, SQLite - one tool for all
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Adminer - Universal Database UI (port 9003)
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: deepkit-adminer
    restart: unless-stopped
    ports:
      - "9003:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    networks:
      - deepkit-network
