# =============================================================================
# MODULE G: Knowledge Graphs (FalkorDB + Graphiti)
# =============================================================================
# "I want AI memory and relationship tracking"
#
# Services: FalkorDB, FalkorDB Browser, Graphiti
# Ports: 6380, 3011, 8000
# Dependencies: Core (Ollama for AI features)
# Note: Graphiti uses the vanilla getzep/graphiti image
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # FalkorDB - Graph Database (port 6380)
  # ---------------------------------------------------------------------------
  falkordb:
    image: falkordb/falkordb:latest
    container_name: deepkit-falkordb
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - falkordb_data:/data
    networks:
      - deepkit-network

  # ---------------------------------------------------------------------------
  # FalkorDB Browser - Visual Graph Explorer (port 3011)
  # ---------------------------------------------------------------------------
  falkordb-browser:
    image: falkordb/falkordb-browser:latest
    container_name: deepkit-falkordb-browser
    restart: unless-stopped
    ports:
      - "3011:3000"
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
    depends_on:
      - falkordb
    networks:
      - deepkit-network

  # ---------------------------------------------------------------------------
  # Graphiti - Knowledge Graph Framework (port 8000)
  # ---------------------------------------------------------------------------
  # Uses vanilla getzep/graphiti - customize as needed
  graphiti:
    image: getzep/graphiti:latest
    container_name: deepkit-graphiti
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Graph DB connection
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      # AI API Keys (optional - for enhanced features)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - falkordb
    networks:
      - deepkit-network

volumes:
  falkordb_data:
    name: deepkit-falkordb-data
