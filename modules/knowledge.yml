# =============================================================================
# MODULE: DEEPKIT_GRAPH + DEEPKIT_MEMORY (FalkorDB + Graphiti)
# =============================================================================
# "I want AI memory and relationship tracking"
#
# Services: DEEPKIT_GRAPH, DEEPKIT_GRAPH_EXPLORER, DEEPKIT_MEMORY
# Ports: 6380, 3011, 8000
# Dependencies: Core (DEEPKIT_ENGINE for AI features)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # DEEPKIT_GRAPH - Graph Database (port 6380)
  # ---------------------------------------------------------------------------
  deepkit-graph:
    image: falkordb/falkordb:latest
    container_name: deepkit-graph
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - graph_data:/data
    networks:
      - deepkit-network

  # ---------------------------------------------------------------------------
  # DEEPKIT_GRAPH_EXPLORER - Visual Graph Explorer (port 3011)
  # ---------------------------------------------------------------------------
  deepkit-graph-explorer:
    image: falkordb/falkordb-browser:latest
    container_name: deepkit-graph-explorer
    restart: unless-stopped
    ports:
      - "3011:3000"
    environment:
      FALKORDB_HOST: deepkit-graph
      FALKORDB_PORT: 6379
    depends_on:
      - deepkit-graph
    networks:
      - deepkit-network

  # ---------------------------------------------------------------------------
  # DEEPKIT_MEMORY - Knowledge Graph Framework (port 8000)
  # ---------------------------------------------------------------------------
  deepkit-memory:
    image: getzep/graphiti:latest
    container_name: deepkit-memory
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Graph DB connection
      FALKORDB_HOST: deepkit-graph
      FALKORDB_PORT: 6379
      # AI API Keys (optional - for enhanced features)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - deepkit-graph
    networks:
      - deepkit-network

volumes:
  graph_data:
    name: deepkit-graph-data
