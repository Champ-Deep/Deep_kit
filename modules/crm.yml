# =============================================================================
# MODULE E: Customer Management (EspoCRM)
# =============================================================================
# "I want to track contacts, deals, and customers"
#
# Services: EspoCRM, MariaDB
# Ports: 3004, 3306
# Dependencies: Core
# Note: EspoCRM requires MariaDB, included in this module
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MariaDB - EspoCRM Database (port 3306)
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:10.11
    container_name: deepkit-mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: espocrm
      MARIADB_USER: espocrm
      MARIADB_PASSWORD: ${ESPOCRM_DB_PASSWORD:?ESPOCRM_DB_PASSWORD is required}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deepkit-network

  # ---------------------------------------------------------------------------
  # EspoCRM - Customer Relationship Management (port 3004)
  # ---------------------------------------------------------------------------
  espocrm:
    image: espocrm/espocrm:latest
    container_name: deepkit-espocrm
    restart: unless-stopped
    ports:
      - "3004:80"
    environment:
      ESPOCRM_DATABASE_HOST: mariadb
      ESPOCRM_DATABASE_USER: espocrm
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DB_PASSWORD}
      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USERNAME:-admin}
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD:?ESPOCRM_ADMIN_PASSWORD is required}
      ESPOCRM_SITE_URL: ${ESPOCRM_SITE_URL:-http://localhost:3004}
    volumes:
      - espocrm_data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - deepkit-network

volumes:
  mariadb_data:
    name: deepkit-mariadb-data
  espocrm_data:
    name: deepkit-espocrm-data
