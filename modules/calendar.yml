services:
  calendar:
    build: ./services/calendar
    container_name: deepkit-calendar
    labels:
      - "com.docker.compose.project=deepkit"
      - "com.docker.compose.service=calendar"
      - "deepkit.service.name=calendar"
      - "deepkit.service.port=7714"
      - "deepkit.health.path=/health"
      - "deepkit.service.type=http"
      - "deepkit.service.zone=THE FACE"
      - "deepkit.service.description=Smart Calendar"
      # Traefik routing
      - "traefik.enable=true"
      - "traefik.http.routers.calendar.rule=PathPrefix(`/calendar`)"
      - "traefik.http.routers.calendar.entrypoints=web"
      - "traefik.http.routers.calendar.middlewares=deepkit-auth"
      - "traefik.http.services.calendar.loadbalancer.server.port=7714"
    restart: unless-stopped
    ports:
      - "7714:7714"
    environment:
      - PORT=7714
      - SERVICE_NAME=calendar
      - NODE_ENV=${NODE_ENV:-production}
      - POSTGRES_HOST=deepkit-store
      - POSTGRES_PORT=5432
      - POSTGRES_DB=calendar
      - POSTGRES_USER=${POSTGRES_USER:-deepkit}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=deepkit-cache
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DEEPKIT_INTERNAL_TOKEN=${DEEPKIT_INTERNAL_TOKEN:-}
    volumes:
      - ./backend/lib/deepkit-fabric/bundle:/app/node_modules/deepkit-fabric:ro
    depends_on:
      deepkit-store:
        condition: service_healthy
      deepkit-cache:
        condition: service_started
    networks:
      - deepkit-network

networks:
  deepkit-network:
    external: true
    name: deepkit-network
