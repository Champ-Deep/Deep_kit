# =============================================================================
# MODULE B: AI Chat Interface (Open WebUI)
# =============================================================================
# "I want to chat with local AI models"
#
# Services: Open WebUI
# Ports: 3001
# Dependencies: Core (Ollama)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Open WebUI - ChatGPT-like Interface (port 3001)
  # ---------------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: deepkit-open-webui
    restart: unless-stopped
    ports:
      - "3001:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "false"
      ENABLE_RAG_WEB_SEARCH: "true"
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      - ollama
    networks:
      - deepkit-network

volumes:
  openwebui_data:
    name: deepkit-openwebui-data
