# =============================================================================
# MODULE: DEEPKIT_CHAT (Open WebUI)
# =============================================================================
# "I want to chat with local AI models"
#
# Services: DEEPKIT_CHAT
# Ports: 3001
# Dependencies: Core (DEEPKIT_ENGINE)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # DEEPKIT_CHAT - AI Conversation Interface (port 3001)
  # ---------------------------------------------------------------------------
  deepkit-chat:
    image: ghcr.io/open-webui/open-webui:main
    container_name: deepkit-chat
    labels:
      - "com.docker.compose.project=deepkit"
      - "com.docker.compose.service=chat"
      - "deepkit.service.name=chat"
      - "deepkit.service.port=3001"
      - "deepkit.health.path=/health"
      - "deepkit.service.type=http"
      - "deepkit.service.zone=THE FACE"
      - "deepkit.service.description=AI Chat Interface"
      # Traefik routing
      - "traefik.enable=true"
      - "traefik.http.routers.chat.rule=PathPrefix(`/chat`)"
      - "traefik.http.routers.chat.entrypoints=web"
      - "traefik.http.routers.chat.middlewares=deepkit-auth"
      - "traefik.http.services.chat.loadbalancer.server.port=8080"
    restart: unless-stopped
    ports:
      - "7701:8080"
    environment:
      OLLAMA_BASE_URL: http://deepkit-engine:11434
      WEBUI_AUTH: "false"
      ENABLE_RAG_WEB_SEARCH: "true"
      # DeepKit Branding
      WEBUI_NAME: "DEEPKIT_CHAT"
      DEFAULT_MODELS: "llama3.2:latest"
    volumes:
      - chat_data:/app/backend/data
      - ./branding/css/deepkit-chat.css:/app/backend/static/css/custom.css:ro
    depends_on:
      - deepkit-engine
    networks:
      - deepkit-network

volumes:
  chat_data:
    name: deepkit-chat-data
