# =============================================================================
# PRESET: Business
# =============================================================================
# For managing customers, content, and business operations.
#
# Included:
#   - Core (PostgreSQL, Redis, Ollama, Portainer)
#   - Module A: n8n (automation)
#   - Module B: Open WebUI (AI chat)
#   - Module D: Strapi CMS (content management)
#   - Module E: EspoCRM (customer management)
#   - Module F: chamPDF (PDF tools)
#   - Module I: Uptime Kuma (monitoring)
#
# Total: 12 services (includes MariaDB for CRM)
# Ports: 5432, 6379, 11434, 9000, 5678, 3001, 3003, 3004, 3306, 3005, 9002
#
# Usage: ./install.sh --preset business
# =============================================================================

include:
  - path: ../docker-compose.yml
  - path: ../modules/automation.yml
  - path: ../modules/chat.yml
  - path: ../modules/cms.yml
  - path: ../modules/crm.yml
  - path: ../modules/pdf.yml
  - path: ../modules/monitoring.yml
