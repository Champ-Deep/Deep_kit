# =============================================================================
# PRESET: Creator
# =============================================================================
# For content creators, marketers, and creative professionals.
#
# Included:
#   - Core (PostgreSQL, Redis, Ollama, Portainer)
#   - Module A: n8n (automation)
#   - Module B: Open WebUI (AI chat)
#   - Module C: Local NotebookLM (document research)
#   - Module D: Strapi CMS (content management)
#   - Module F: chamPDF (PDF tools)
#
# Total: 9 services
# Ports: 5432, 6379, 11434, 9000, 5678, 3001, 3002, 3003, 3005
#
# Usage: ./install.sh --preset creator
# =============================================================================

include:
  - path: ../docker-compose.yml
  - path: ../modules/automation.yml
  - path: ../modules/chat.yml
  - path: ../modules/research.yml
  - path: ../modules/cms.yml
  - path: ../modules/pdf.yml
