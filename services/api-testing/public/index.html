<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEEPKIT_API_TESTING</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root { --phosphor: #39FF14; --bg: #000000; }
    body { background: var(--bg); color: var(--phosphor); font-family: 'JetBrains Mono', monospace; padding: 20px; }
    body::before {
      content: " "; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 255, 0, 0.06));
      z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
    }
    .header { border-bottom: 2px solid var(--phosphor); padding-bottom: 10px; margin-bottom: 20px; }
    .title { font-family: 'VT323', monospace; font-size: 2.5rem; text-transform: uppercase; }
    .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
    select, input { background: #050505; border: 1px solid var(--phosphor); color: var(--phosphor); padding: 10px; }
    button { background: var(--phosphor); color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
    .response-area { border: 1px solid var(--phosphor); height: 400px; padding: 10px; background: #050505; overflow: auto; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    const ApiApp = () => {
      const [res, setRes] = useState('READY_FOR_REQUEST');
      return (
        <div className="container">
          <div className="header">
            <div className="title">DEEPKIT // NEXUS_TESTER</div>
            <div>REST & GRAPHQL DEBUGGER</div>
          </div>
          <div className="input-row">
            <select><option>GET</option><option>POST</option></select>
            <input style={{flex: 1}} placeholder="http://localhost:7777/health" />
            <button onClick={() => setRes('SENDING...')}>SEND</button>
          </div>
          <div className="response-area">
            <pre>{res}</pre>
          </div>
        </div>
      );
    };
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ApiApp />);
  </script>
</body>
</html>
