<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepKit Messenger — THE PROXY</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>DeepKit Messenger — THE PROXY</h1>
      <div class="port-info">Port: 51000</div>
    </header>

    <!-- Service Status Dashboard -->
    <section class="status-dashboard">
      <div class="status-item" id="status-postgres">
        <span class="status-label">Postgres</span>
        <span class="status-indicator">○</span>
      </div>
      <div class="status-item" id="status-ollama">
        <span class="status-label">Ollama</span>
        <span class="status-indicator">○</span>
      </div>
      <div class="status-item" id="status-n8n">
        <span class="status-label">n8n</span>
        <span class="status-indicator">○</span>
      </div>
      <div class="status-item" id="status-agent">
        <span class="status-label">AgentCore</span>
        <span class="status-indicator">○</span>
      </div>
    </section>

    <!-- Main Content: Chat + Tool Log -->
    <div class="main-content">
      <!-- Chat Area (Left) -->
      <section class="chat-area">
        <h2>Chat History</h2>
        <div class="chat-history" id="chat-history">
          <div class="welcome-message">
            Welcome to DeepKit Messenger. Type a message to interact with your sovereign AI agent.
          </div>
        </div>

        <!-- Message Input -->
        <div class="chat-input-area">
          <input
            type="text"
            id="message-input"
            placeholder="Type message..."
            autocomplete="off"
          >
          <button id="send-button">Send</button>
        </div>
      </section>

      <!-- Tool Execution Log (Right) -->
      <section class="tool-log">
        <h2>Tool Execution Log</h2>
        <div class="tool-log-content" id="tool-log">
          <div class="log-entry log-info">
            Waiting for tool execution...
          </div>
        </div>
      </section>
    </div>

    <!-- Footer Stats -->
    <footer class="footer">
      <div class="footer-stat">
        <span class="stat-label">Uptime:</span>
        <span id="uptime">--</span>
      </div>
      <div class="footer-stat">
        <span class="stat-label">Requests:</span>
        <span id="request-count">--</span>
      </div>
      <div class="footer-stat">
        <span class="stat-label">Memory:</span>
        <span id="memory-usage">--</span>
      </div>
      <div class="footer-stat">
        <span class="stat-label">Tasks:</span>
        <span id="task-count">--</span>
      </div>
    </footer>
  </div>

  <script src="chat.js"></script>
</body>
</html>
