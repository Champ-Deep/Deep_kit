<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEEPKIT_MARKETING_360</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --phosphor: #39FF14;
      --bg: #000000;
    }
    body {
      background: var(--bg);
      color: var(--phosphor);
      font-family: 'JetBrains Mono', monospace;
      padding: 20px;
    }
    body::before {
      content: " ";
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 255, 255, 0.06));
      z-index: 2;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }
    .header { border-bottom: 2px solid var(--phosphor); padding-bottom: 10px; margin-bottom: 20px; }
    .title { font-family: 'VT323', monospace; font-size: 2.5rem; text-transform: uppercase; }
    .nav { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid rgba(57, 255, 20, 0.3); padding-bottom: 10px; }
    .nav-item { cursor: pointer; opacity: 0.6; }
    .nav-item.active { opacity: 1; border-bottom: 2px solid var(--phosphor); }
    .card { border: 1px solid var(--phosphor); padding: 20px; background: rgba(57, 255, 20, 0.05); margin-bottom: 20px; }
    button { background: transparent; border: 1px solid var(--phosphor); color: var(--phosphor); padding: 8px 20px; cursor: pointer; font-family: 'JetBrains Mono', monospace; }
    button:hover { background: var(--phosphor); color: #000; }
    input, textarea { background: #050505; border: 1px solid var(--phosphor); color: var(--phosphor); padding: 10px; width: 100%; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const MarketingApp = () => {
      const [tab, setTab] = useState('campaigns');
      const [contacts, setContacts] = useState([]);

      useEffect(() => {
        if (tab === 'contacts') fetchContacts();
      }, [tab]);

      const fetchContacts = async () => {
        const res = await fetch('/api/contacts');
        const data = await res.json();
        setContacts(data.contacts || []);
      };

      return (
        <div className="container">
          <div className="header">
            <div className="title">DEEPKIT // MARKETING_360</div>
            <div>OUTREACH & ANALYTICS DASHBOARD</div>
          </div>

          <div className="nav">
            <div className={`nav-item ${tab === 'campaigns' ? 'active' : ''}`} onClick={() => setTab('campaigns')}>CAMPAIGNS</div>
            <div className={`nav-item ${tab === 'contacts' ? 'active' : ''}`} onClick={() => setTab('contacts')}>CONTACTS</div>
            <div className={`nav-item ${tab === 'ai' ? 'active' : ''}`} onClick={() => setTab('ai')}>AI_GEN</div>
          </div>

          {tab === 'campaigns' && (
            <div className="card">
              <h3>ACTIVE CAMPAIGNS</h3>
              <p>No active campaigns. Initialize outreach?</p>
              <button>+ NEW CAMPAIGN</button>
            </div>
          )}

          {tab === 'contacts' && (
            <div className="card">
              <h3>AUDIENCE DATABASE</h3>
              <table style={{width: '100%', textAlign: 'left'}}>
                <thead>
                  <tr><th>NAME</th><th>EMAIL</th><th>TAGS</th></tr>
                </thead>
                <tbody>
                  {contacts.map(c => <tr key={c.id}><td>{c.name}</td><td>{c.email}</td><td>{c.tags}</td></tr>)}
                </tbody>
              </table>
              {contacts.length === 0 && <p>Database empty.</p>}
            </div>
          )}

          {tab === 'ai' && (
            <div className="card">
              <h3>NANO BANANA // AI GENERATOR</h3>
              <textarea placeholder="PROMPT: Generate a social post for..."></textarea>
              <button>GENERATE ASSETS</button>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MarketingApp />);
  </script>
</body>
</html>
