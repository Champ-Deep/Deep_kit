# DeepKit Messenger - THE PROXY
# Port 51000 (High-port range to avoid conflicts)
#
# IMPORTANT: This service connects to EXISTING DeepKit infrastructure
# Do NOT run standalone - requires main DeepKit stack to be running first

version: '3.8'

services:
  deepkit-messenger:
    build: .
    container_name: deepkit-messenger
    restart: unless-stopped
    ports:
      - "51000:3333"
    environment:
      # Server config
      PORT: 3333
      NODE_ENV: production
      LOG_LEVEL: info

      # Connect to EXISTING DeepKit services (use internal DNS names)
      DEEPKIT_POSTGRES_HOST: deepkit-store    # THE VAULT (existing)
      DEEPKIT_POSTGRES_PORT: 5432
      DEEPKIT_POSTGRES_DB: messenger          # New database in shared instance
      DEEPKIT_POSTGRES_USER: ${POSTGRES_USER:-deepkit}
      DEEPKIT_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepkit_secure_2024}

      REDIS_HOST: deepkit-cache               # THE CACHE (existing)
      REDIS_PORT: 6379

      # Ollama (THE BRAIN - existing service)
      OLLAMA_BASE_URL: http://deepkit-engine:11434
      OLLAMA_MODEL: llama3.2:latest

      # n8n (THE ENGINE - existing service)
      N8N_WEBHOOK_URL: http://deepkit-n8n:5678
      N8N_API_KEY: ${N8N_API_KEY:-}

      # Whatomate (WhatsApp)
      WHATOMATE_API_KEY: ${WHATOMATE_API_KEY:-}
      WHATOMATE_VERIFY_TOKEN: ${WHATOMATE_VERIFY_TOKEN:-deepkit-verify}
      WHATOMATE_WEBHOOK_URL: ${WHATOMATE_WEBHOOK_URL:-}

      # Optional integrations
      NOTION_API_KEY: ${NOTION_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}

    # Connect to existing DeepKit network
    # Service discovery via Docker DNS: deepkit-store, deepkit-engine, deepkit-cache
    networks:
      - deepkit-network

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3333/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    labels:
      - "com.docker.compose.project=deepkit"
      - "com.docker.compose.service=messenger"
      - "deepkit.service.name=DeepKit Messenger"
      - "deepkit.service.port=51000"
      - "deepkit.service.zone=THE PROXY"
      - "deepkit.service.type=http"
      - "deepkit.health.path=/health"
      - "deepkit.service.description=WhatsApp/Telegram intelligent assistant"

  # n8n Workflow Automation - THE ENGINE
  # Simplified setup using SQLite (no Redis dependency)
  deepkit-n8n:
    image: n8nio/n8n:latest
    container_name: deepkit-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Use SQLite for simplicity (no Redis/Postgres required)
      DB_TYPE: sqlite
      DB_SQLITE_DATABASE: /home/node/.n8n/database.sqlite
      # Security
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-deepkit-n8n-encryption-key-2026}
      # Disable external calls for security
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Timezone
      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
      # Webhook URL for external triggers
      WEBHOOK_URL: http://localhost:5678
      # AI Integration with Ollama
      N8N_AI_ENABLED: "true"
      OLLAMA_HOST: http://deepkit-engine:11434
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - deepkit-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.docker.compose.project=deepkit"
      - "com.docker.compose.service=n8n"
      - "deepkit.service.name=DeepKit n8n"
      - "deepkit.service.port=5678"
      - "deepkit.service.zone=THE ENGINE"
      - "deepkit.service.type=http"
      - "deepkit.health.path=/healthz"
      - "deepkit.service.description=Workflow Automation Engine"

volumes:
  n8n_data:
    name: deepkit-n8n-data

# Use EXISTING DeepKit network (must be created by main stack)
# The messenger service will discover deepkit-store, deepkit-engine, deepkit-cache
# via Docker's internal DNS on this network
networks:
  deepkit-network:
    external: true
    name: deepkit-network
