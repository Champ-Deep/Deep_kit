<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEEPKIT_SUPER_ADMIN</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --phosphor: #39FF14;
      --bg: #000000;
    }
    body {
      background: var(--bg);
      color: var(--phosphor);
      font-family: 'JetBrains Mono', monospace;
      padding: 20px;
      overflow-x: hidden;
    }
    body::before {
      content: " ";
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }
    .header {
      border-bottom: 2px solid var(--phosphor);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    .title {
      font-family: 'VT323', monospace;
      font-size: 2.5rem;
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .card {
      border: 1px solid var(--phosphor);
      padding: 15px;
      background: rgba(57, 255, 20, 0.05);
    }
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border: 1px solid var(--phosphor);
      font-size: 0.8rem;
      margin-bottom: 10px;
    }
    .logs {
      background: #050505;
      border: 1px solid var(--phosphor);
      height: 300px;
      overflow-y: auto;
      font-size: 0.7rem;
      padding: 10px;
      margin-top: 20px;
    }
    button {
      background: transparent;
      border: 1px solid var(--phosphor);
      color: var(--phosphor);
      padding: 5px 15px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      margin-right: 10px;
    }
    button:hover {
      background: var(--phosphor);
      color: #000;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const SuperAdminApp = () => {
      const [containers, setContainers] = useState([]);
      const [logs, setLogs] = useState([]);

      useEffect(() => {
        fetchStatus();
        const interval = setInterval(fetchStatus, 5000);
        return () => clearInterval(interval);
      }, []);

      const fetchStatus = async () => {
        try {
          const res = await fetch('/api/containers');
          const data = await res.json();
          setContainers(data || []);
        } catch (e) {
          console.error(e);
        }
      };

      const viewLogs = async (id) => {
        try {
          const res = await fetch(`/api/containers/${id}/logs?tail=50`);
          const data = await res.json();
          setLogs(data.logs || 'No logs available');
        } catch (e) {
          setLogs('Error fetching logs');
        }
      };

      return (
        <div className="container">
          <div className="header">
            <div className="title">DEEPKIT // SUPER_ADMIN</div>
            <div>SYSTEM CONTROL PANEL v1.0</div>
          </div>

          <div className="grid">
            {containers.map(c => (
              <div key={c.Id} className="card">
                <div style={{fontWeight: 'bold'}}>{c.Names[0].replace('/', '')}</div>
                <div className="status-badge">{c.State.toUpperCase()}</div>
                <div>Port: {c.Ports[0]?.PublicPort}</div>
                <div style={{marginTop: '10px'}}>
                  <button onClick={() => viewLogs(c.Id)}>LOGS</button>
                  <button>RESTART</button>
                </div>
              </div>
            ))}
          </div>

          <div className="logs">
            <div style={{borderBottom: '1px solid', marginBottom: '5px', paddingBottom: '2px'}}>SYSTEM_LOG_FEED</div>
            <pre>{logs}</pre>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SuperAdminApp />);
  </script>
</body>
</html>
