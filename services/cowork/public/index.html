<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEEPKIT_COWORK</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="/js/hardware-pulse.js"></script>
  <link rel="stylesheet" href="/css/custom.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      background: #000000;
      color: #39FF14;
      min-height: 100vh;
      overflow: hidden;
    }

    .cowork-container {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
    }

    .cowork-header {
      border-bottom: 2px solid #39FF14;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(57,255,20,0.05) 0%, transparent 100%);
    }

    .cowork-header h1 {
      font-size: 24px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
      animation: flicker 3s infinite;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.95; }
    }

    .header-right {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .session-info {
      font-size: 12px;
      opacity: 0.7;
      text-transform: uppercase;
    }

    .main-content {
      display: grid;
      grid-template-columns: 250px 1fr;
      height: 100%;
      overflow: hidden;
    }

    .tool-palette {
      border-right: 2px solid #39FF14;
      padding: 20px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.5);
    }

    .tool-palette h2 {
      font-size: 14px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.8;
    }

    .tool-category {
      margin-bottom: 25px;
    }

    .tool-category-title {
      font-size: 11px;
      color: #FFB000;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tool-button {
      width: 100%;
      background: rgba(57, 255, 20, 0.1);
      border: 1px solid #39FF14;
      color: #39FF14;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      transition: all 0.2s;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-button:hover {
      background: rgba(57, 255, 20, 0.2);
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
      transform: translateX(3px);
    }

    .tool-button.active {
      background: #39FF14;
      color: #000000;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.5);
    }

    .tool-icon {
      font-size: 16px;
    }

    .conversation-area {
      display: grid;
      grid-template-rows: 1fr auto;
      height: 100%;
      overflow: hidden;
    }

    .messages-container {
      padding: 20px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .message {
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid rgba(57, 255, 20, 0.3);
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      background: rgba(57, 255, 20, 0.05);
      border-left: 3px solid #39FF14;
    }

    .message.assistant {
      background: rgba(0, 0, 0, 0.5);
      border-left: 3px solid #00FF00;
    }

    .message.tool {
      background: rgba(255, 176, 0, 0.05);
      border-left: 3px solid #FFB000;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
    }

    .message-content {
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .tool-result {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #FFB000;
      padding: 10px;
      margin-top: 10px;
      font-size: 12px;
    }

    .tool-result-header {
      color: #FFB000;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .input-area {
      border-top: 2px solid #39FF14;
      padding: 20px;
      background: rgba(0, 0, 0, 0.8);
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .unified-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #39FF14;
      color: #39FF14;
      padding: 15px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      outline: none;
      resize: none;
      min-height: 60px;
      max-height: 150px;
    }

    .unified-input:focus {
      border-color: #00FF00;
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.5);
    }

    .send-button {
      background: rgba(57, 255, 20, 0.2);
      border: 2px solid #39FF14;
      color: #39FF14;
      padding: 15px 30px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .send-button:hover:not(:disabled) {
      background: #39FF14;
      color: #000000;
      box-shadow: 0 0 20px rgba(57, 255, 20, 0.7);
    }

    .send-button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .loading-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #FFB000;
      font-size: 12px;
      margin-top: 10px;
    }

    .loading-dots::after {
      content: '...';
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      opacity: 0.5;
      text-align: center;
      padding: 40px;
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .empty-state-text {
      font-size: 14px;
      line-height: 1.8;
    }

    /* CRT Scanlines */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      z-index: 9999;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #000000;
      border: 1px solid #39FF14;
    }

    ::-webkit-scrollbar-thumb {
      background: #39FF14;
      border: 1px solid #000000;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #00FF00;
    }

    /* Hardware Pulse Widget */
    #hardware-pulse-widget {
      font-size: 10px;
    }

    .alert {
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid;
      animation: fadeIn 0.3s;
    }

    .alert.error {
      background: rgba(255, 0, 0, 0.1);
      border-color: #FF0000;
      color: #FF0044;
    }

    .alert.success {
      background: rgba(0, 255, 0, 0.1);
      border-color: #00FF00;
      color: #00FF00;
    }

    .typing-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #39FF14;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
      margin-left: 5px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TOOL_CATEGORIES = {
      'THE FACE': [
        { name: 'champmail', icon: '📧', port: 3025, description: 'Email automation' },
        { name: 'marketing360', icon: '📱', port: 3012, description: 'Marketing campaigns' },
        { name: 'calendar', icon: '📅', port: 3014, description: 'Event scheduling' },
        { name: 'invoicing', icon: '💰', port: 3015, description: 'Invoice management' },
        { name: 'password_manager', icon: '🔐', port: 3016, description: 'Secure vault' },
        { name: 'task_tracker', icon: '✓', port: 3018, description: 'Gamified tasks' },
        { name: 'time_tracker', icon: '⏱️', port: 3019, description: 'Billable hours' },
        { name: 'file_manager', icon: '📁', port: 3020, description: 'File browser' },
      ],
      'THE ENGINE': [
        { name: 'qr_generator', icon: '🔲', port: 3010, description: 'QR codes' },
        { name: 'link_shortener', icon: '🔗', port: 3011, description: 'URL shortening' },
        { name: 'webhook_manager', icon: '🔔', port: 3021, description: 'Event bus' },
        { name: 'api_testing', icon: '🧪', port: 3017, description: 'API testing' },
      ],
      'SUPPORT': [
        { name: 'request_tracker', icon: '🎫', port: 3008, description: 'Support tickets' },
        { name: 'utm_tracker', icon: '📊', port: 3007, description: 'Campaign tracking' },
      ],
      'SPECIAL': [
        { name: 'lakeb2b_referral', icon: '🎁', description: '25% off LakeB2B' },
      ]
    };

    const CoWorkApp = () => {
      const [sessionId, setSessionId] = useState(null);
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [selectedTools, setSelectedTools] = useState([]);
      const [isStreaming, setIsStreaming] = useState(false);
      const [alert, setAlert] = useState(null);
      const [tools, setTools] = useState([]);
      const messagesEndRef = useRef(null);
      const eventSourceRef = useRef(null);

      useEffect(() => {
        initializeSession();
        loadTools();

        // Initialize Hardware Pulse widget
        if (window.DeepKitPulse) {
          window.DeepKitPulse.init('hardware-pulse-widget', {
            position: 'embedded',
            compact: true,
            updateInterval: 3000
          });
        }
      }, []);

      useEffect(() => {
        scrollToBottom();
      }, [messages]);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      const initializeSession = async () => {
        try {
          const response = await fetch('/api/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: 'default' })
          });

          const data = await response.json();
          setSessionId(data.sessionId);
          console.log('Session created:', data.sessionId);
        } catch (error) {
          console.error('Failed to create session:', error);
          showAlert('Failed to initialize session', 'error');
        }
      };

      const loadTools = async () => {
        try {
          const response = await fetch('/api/tools');
          const data = await response.json();
          setTools(data.tools || []);
        } catch (error) {
          console.error('Failed to load tools:', error);
        }
      };

      const showAlert = (message, type = 'success') => {
        setAlert({ message, type });
        setTimeout(() => setAlert(null), 5000);
      };

      const toggleTool = (toolName) => {
        setSelectedTools(prev =>
          prev.includes(toolName)
            ? prev.filter(t => t !== toolName)
            : [...prev, toolName]
        );
      };

      const handleSend = async () => {
        if (!input.trim() || !sessionId || isStreaming) return;

        const userMessage = input.trim();
        setInput('');
        setIsStreaming(true);

        // Add user message to UI
        setMessages(prev => [...prev, {
          role: 'user',
          content: userMessage,
          timestamp: new Date()
        }]);

        // Create assistant message placeholder
        let assistantMessage = '';
        const assistantMessageIndex = messages.length + 1;

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: userMessage,
              sessionId,
              tools: selectedTools
            })
          });

          const reader = response.body.getReader();
          const decoder = new TextDecoder();

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value);
            const lines = chunk.split('\n');

            for (const line of lines) {
              if (line.startsWith('data: ')) {
                try {
                  const data = JSON.parse(line.slice(6));

                  if (data.type === 'chunk') {
                    assistantMessage += data.content;

                    // Update or add assistant message
                    setMessages(prev => {
                      const newMessages = [...prev];
                      const lastMsg = newMessages[newMessages.length - 1];

                      if (lastMsg && lastMsg.role === 'assistant') {
                        lastMsg.content = assistantMessage;
                      } else {
                        newMessages.push({
                          role: 'assistant',
                          content: assistantMessage,
                          timestamp: new Date()
                        });
                      }

                      return newMessages;
                    });
                  } else if (data.type === 'tool_result') {
                    setMessages(prev => [...prev, {
                      role: 'tool',
                      tool: data.tool,
                      content: JSON.stringify(data.result, null, 2),
                      timestamp: new Date()
                    }]);
                  } else if (data.type === 'tool_error') {
                    showAlert(`Tool error (${data.tool}): ${data.error}`, 'error');
                  } else if (data.type === 'done') {
                    console.log('Stream complete');
                  } else if (data.type === 'error') {
                    showAlert(data.message, 'error');
                  }
                } catch (e) {
                  console.error('Failed to parse SSE data:', e);
                }
              }
            }
          }
        } catch (error) {
          console.error('Chat error:', error);
          showAlert('Failed to send message: ' + error.message, 'error');
        } finally {
          setIsStreaming(false);
        }
      };

      const handleKeyPress = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      };

      return (
        <div className="cowork-container">
          <header className="cowork-header">
            <h1>DEEPKIT_COWORK</h1>
            <div className="header-right">
              <div className="session-info">
                Session: {sessionId ? sessionId.substring(0, 8) : 'Loading...'}
              </div>
              <div id="hardware-pulse-widget"></div>
            </div>
          </header>

          <div className="main-content">
            <aside className="tool-palette">
              <h2>🛠️ Available Tools</h2>

              {Object.entries(TOOL_CATEGORIES).map(([category, categoryTools]) => (
                <div key={category} className="tool-category">
                  <div className="tool-category-title">{category}</div>
                  {categoryTools.map(tool => (
                    <button
                      key={tool.name}
                      className={`tool-button ${selectedTools.includes(tool.name) ? 'active' : ''}`}
                      onClick={() => toggleTool(tool.name)}
                      title={tool.description}
                    >
                      <span className="tool-icon">{tool.icon}</span>
                      <span>{tool.name}</span>
                    </button>
                  ))}
                </div>
              ))}

              <div style={{ marginTop: '20px', fontSize: '11px', opacity: 0.5 }}>
                {selectedTools.length > 0 && (
                  <div>{selectedTools.length} tool(s) selected</div>
                )}
              </div>
            </aside>

            <div className="conversation-area">
              <div className="messages-container">
                {alert && (
                  <div className={`alert ${alert.type}`}>
                    {alert.message}
                  </div>
                )}

                {messages.length === 0 && (
                  <div className="empty-state">
                    <div className="empty-state-icon">🤖</div>
                    <div className="empty-state-text">
                      <strong>Welcome to DeepKit Co-Work</strong><br/>
                      Your unified AI workspace with access to 26 tools.<br/><br/>
                      Select tools from the left panel and start chatting!<br/>
                      Try: "Send an email" or "Create a task" or "Get LakeB2B discount"
                    </div>
                  </div>
                )}

                {messages.map((msg, idx) => (
                  <div key={idx} className={`message ${msg.role}`}>
                    <div className="message-header">
                      <span>{msg.role === 'user' ? '👤 You' : msg.role === 'assistant' ? '🤖 AI' : `🔧 ${msg.tool}`}</span>
                      <span>{msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : ''}</span>
                    </div>
                    <div className="message-content">
                      {msg.content}
                    </div>
                    {msg.role === 'tool' && (
                      <div className="tool-result">
                        <div className="tool-result-header">Tool Result:</div>
                        <pre style={{ margin: 0, fontSize: '11px' }}>{msg.content}</pre>
                      </div>
                    )}
                  </div>
                ))}

                {isStreaming && messages.length > 0 && messages[messages.length - 1].role === 'assistant' && (
                  <span className="typing-indicator"></span>
                )}

                <div ref={messagesEndRef} />
              </div>

              <div className="input-area">
                {isStreaming && (
                  <div className="loading-indicator">
                    <span className="typing-indicator"></span>
                    <span>AI is thinking<span className="loading-dots"></span></span>
                  </div>
                )}

                <div className="input-wrapper">
                  <textarea
                    className="unified-input"
                    value={input}
                    onChange={(e) => setInput(e.target.value)}
                    onKeyPress={handleKeyPress}
                    placeholder="Ask anything... (Shift+Enter for new line, Enter to send)"
                    disabled={isStreaming || !sessionId}
                  />
                  <button
                    className="send-button"
                    onClick={handleSend}
                    disabled={isStreaming || !input.trim() || !sessionId}
                  >
                    Send
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<CoWorkApp />, document.getElementById('root'));
  </script>

  <!-- Hardware Pulse Widget Script -->
  <script src="../../../branding/components/hardware-pulse.js"></script>
</body>
</html>
