# =============================================================================
# DEEPKIT - Core Services
# =============================================================================
# "Your Personal AI. Locally Contained. Locally Empowered."
#
# This file contains only the CORE services that are always installed.
# Additional modules can be added using files from the modules/ directory.
#
# Usage:
#   docker compose up -d                    # Start core services
#   docker compose -f docker-compose.yml -f modules/automation.yml up -d
#
# For presets, use the install.sh script:
#   ./install.sh --preset minimal
#
# =============================================================================

name: deepkit

services:
  # ---------------------------------------------------------------------------
  # DEEPKIT_STORE - PostgreSQL Database (port 5432)
  # ---------------------------------------------------------------------------
  # Single PostgreSQL instance for all applications.
  # Each app uses its own database within this instance.
  deepkit-store:
    image: postgres:16-alpine
    container_name: deepkit-store
    restart: unless-stopped
    # Port NOT exposed to host - only accessible via deepkit-network
    # Use Adminer (behind Traefik auth) or docker exec for external DB access
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-deepkit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deepkit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - deepkit-network

  # ---------------------------------------------------------------------------
  # DEEPKIT_CACHE - Redis Caching & Job Queues (port 6379)
  # ---------------------------------------------------------------------------
  deepkit-cache:
    image: redis:7-alpine
    container_name: deepkit-cache
    restart: unless-stopped
    # Port NOT exposed to host - only accessible via deepkit-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - deepkit-network

  # ---------------------------------------------------------------------------
  # DEEPKIT_ENGINE - Ollama Local AI Models (port 11434)
  # ---------------------------------------------------------------------------
  # CPU version (default) - Powers all AI features locally
  deepkit-engine:
    image: ollama/ollama:latest
    container_name: deepkit-engine
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - deepkit-network

# =============================================================================
# Networks
# =============================================================================
networks:
  deepkit-network:
    external: true
    name: deepkit-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    name: deepkit-store-data
  redis_data:
    name: deepkit-cache-data
  ollama_data:
    name: deepkit-engine-data
